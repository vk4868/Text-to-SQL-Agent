[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigquery-sql-agent"
version = "1.0.0"
description = "Natural-language-to-SQL agent over Google BigQuery with a six-stage safety pipeline, an LLM repair loop, and structured run logging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vineet Kumar" }]
keywords = ["bigquery", "sql", "agent", "text-to-sql", "llm", "guardrails", "data-analysis"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-cloud-bigquery>=3.42.2",
    "langchain>=1.3.13",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "sqlglot>=30.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::PendingDeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 88
exclude = [".venv"]

[tool.pyrefly]
search-path = ["."]
disable-search-path-heuristics = true
