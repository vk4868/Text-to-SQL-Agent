[project]
name = "sql-bigquery-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.42.2",
    "langchain>=1.3.13",
    "langgraph>=1.2.9",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlglot>=30.12.0",
    "streamlit>=1.62.0",
]

# testpaths is load-bearing: the ~35 legacy smoke scripts at the repo root are
# named test_*.py but are print-only scripts, and several would error during
# collection. Only tests/ is a real suite.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live_bq and not live_llm'"
markers = [
    "live_bq: requires live BigQuery credentials",
    "live_llm: requires a running Ollama server",
]

[tool.pyrefly]
search-path = ["."]
disable-search-path-heuristics = true

# LangGraph bounds StateGraph's `StateT` to structural protocols requiring
# `__required_keys__` / `__optional_keys__`, since a TypeVar cannot be bound to
# TypedDict directly. Pyrefly does not match TypedDict classes against those
# protocols, so it rejects every TypedDict state schema. Scoped to the graph
# package so the check stays active for the rest of the project.
[[tool.pyrefly.sub-config]]
matches = "src/graph/**"

[tool.pyrefly.sub-config.errors]
bad-specialization = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
