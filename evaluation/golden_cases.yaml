- case_id: average_discount_by_promotion_2025
  question: What was the average discount percentage by promotion type in 2025?
  category: aggregation
  difficulty: medium
  notes: An average rather than a sum, so a SUM/COUNT confusion shows up here.
  expect:
    referenced_tables: ["your-project-id.business_insights.fact_sales"]
    must_use_columns: [discount_pct, promotion_type]
    reference_sql: |
      SELECT
        promotion_type,
        AVG(discount_pct) AS average_discount_pct
      FROM `your-project-id.business_insights.fact_sales`
      WHERE sale_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY promotion_type
    comparison: multiset

- case_id: profit_margin_by_category_2025
  question: What was the profit margin as a percentage of net revenue for each product category in 2025?
  category: ratio
  difficulty: hard
  notes: >
    A division, so SAFE_DIVIDE matters. Tolerance is looser because a model
    may express the margin as a fraction or a percentage — the reference uses
    a percentage.
  expect:
    referenced_tables:
      - your-project-id.business_insights.fact_sales
      - your-project-id.business_insights.dim_products
    must_use_columns: [profit_amount, net_revenue, category]
    reference_sql: |
      SELECT
        p.category,
        SAFE_DIVIDE(SUM(f.profit_amount), SUM(f.net_revenue)) * 100
          AS profit_margin_pct
      FROM `your-project-id.business_insights.fact_sales` AS f
      JOIN `your-project-id.business_insights.dim_products` AS p
        ON f.product_id = p.product_id
      WHERE f.sale_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY p.category
    comparison: multiset
    numeric_tolerance: 0.5

