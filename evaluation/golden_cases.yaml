- case_id: no_sales_in_1999
  question: What were net sales by month in 1999?
  category: empty_result
  difficulty: easy
  notes: >
    The dataset holds nothing for 1999. Grouped by month deliberately: a bare
    SUM over no rows returns one NULL row, which would not exercise the
    zero-row path at all, whereas a GROUP BY returns genuinely no rows. Tests
    that an empty result is answered honestly rather than invented.
  expect:
    referenced_tables: ["your-project-id.business_insights.fact_sales"]
    must_use_columns: [net_revenue]
    reference_sql: |
      SELECT
        FORMAT_DATE('%Y-%m', sale_date) AS month,
        SUM(net_revenue) AS total_net_sales
      FROM `your-project-id.business_insights.fact_sales`
      WHERE sale_date BETWEEN '1999-01-01' AND '1999-12-31'
      GROUP BY month
    comparison: multiset
