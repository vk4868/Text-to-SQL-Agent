# Golden questions with a hand-written reference query.
#
# Scoring is execution accuracy: the agent's result set is compared to the
# reference query's result set by VALUE, not by column name or SQL text. The
# agent is free to alias columns, order joins, or phrase the query however it
# likes, as long as the numbers come out right. This is the Spider/BIRD
# metric, and it is why no LLM judge is needed.
#
# Cases are drawn from the patterns deliberately embedded in the dataset
# (see Datasets/DATA_DICTIONARY.md), so a correct answer is checkable and a
# wrong one is meaningful rather than arbitrary.
#
# comparison:
#   multiset - order-insensitive; the default, since ORDER BY is usually
#              unstated in the question
#   ordered  - order matters, for "top N" style questions
#   scalar   - a single value

- case_id: net_sales_by_month_2025
  question: What were total net sales by month in 2025?
  category: time_series_aggregation
  difficulty: easy
  notes: The canonical question. Exercises partition pruning on sale_date.
  expect:
    referenced_tables: ["your-project-id.business_insights.fact_sales"]
    must_use_columns: [net_revenue, sale_date]
    reference_sql: |
      SELECT
        FORMAT_DATE('%Y-%m', sale_date) AS month,
        SUM(net_revenue) AS total_net_sales
      FROM `your-project-id.business_insights.fact_sales`
      WHERE sale_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY month
      ORDER BY month
    comparison: multiset

- case_id: total_net_sales_2025
  question: What were total net sales in 2025?
  category: aggregation
  difficulty: easy
  expect:
    referenced_tables: ["your-project-id.business_insights.fact_sales"]
