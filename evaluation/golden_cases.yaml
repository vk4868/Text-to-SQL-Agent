- case_id: total_profit_2025
  question: What was the total profit in 2025?
  category: aggregation
  difficulty: easy
  notes: >
    Tests the "profit" -> profit_amount mapping. A model that computes
    revenue minus cost by hand should still land on the same number.
  expect:
    referenced_tables: ["your-project-id.business_insights.fact_sales"]
    must_use_columns: [profit_amount]
    reference_sql: |
      SELECT SUM(profit_amount) AS total_profit
      FROM `your-project-id.business_insights.fact_sales`
      WHERE sale_date BETWEEN '2025-01-01' AND '2025-12-31'
    comparison: scalar

- case_id: profit_by_category_2025
  question: Which product category generated the most profit in 2025?
  category: join
  difficulty: medium
  notes: Requires the fact-to-product join; category lives only on the dimension.
  expect:
    referenced_tables:
      - your-project-id.business_insights.fact_sales
      - your-project-id.business_insights.dim_products
    must_use_columns: [profit_amount, category]
    reference_sql: |
      SELECT
        p.category,
        SUM(f.profit_amount) AS total_profit
      FROM `your-project-id.business_insights.fact_sales` AS f
      JOIN `your-project-id.business_insights.dim_products` AS p
        ON f.product_id = p.product_id
      WHERE f.sale_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY p.category
      ORDER BY total_profit DESC
      LIMIT 1
    comparison: ordered

- case_id: top_5_products_by_revenue_2025
  question: What were the top 5 products by net revenue in 2025?
  category: ranking
  difficulty: medium
  expect:
    referenced_tables:
      - your-project-id.business_insights.fact_sales
      - your-project-id.business_insights.dim_products
    must_use_columns: [net_revenue, product_name]
    reference_sql: |
      SELECT
        p.product_name,
        SUM(f.net_revenue) AS total_net_revenue
      FROM `your-project-id.business_insights.fact_sales` AS f
      JOIN `your-project-id.business_insights.dim_products` AS p
        ON f.product_id = p.product_id
      WHERE f.sale_date BETWEEN '2025-01-01' AND '2025-12-31'
      GROUP BY p.product_name
      ORDER BY total_net_revenue DESC
      LIMIT 5
    comparison: ordered

