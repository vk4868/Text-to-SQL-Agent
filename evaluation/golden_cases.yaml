- case_id: electronics_november_december_2025
  question: What were net sales for the Electronics category in November and December 2025?
  category: join
  difficulty: medium
  notes: >
    Targets the embedded holiday uplift on Electronics, so the answer should
    be visibly large relative to other months.
  expect:
    referenced_tables:
      - your-project-id.business_insights.fact_sales
      - your-project-id.business_insights.dim_products
    must_use_columns: [net_revenue, category]
    reference_sql: |
      SELECT SUM(f.net_revenue) AS total_net_sales
      FROM `your-project-id.business_insights.fact_sales` AS f
      JOIN `your-project-id.business_insights.dim_products` AS p
        ON f.product_id = p.product_id
      WHERE p.category = 'Electronics'
        AND f.sale_date BETWEEN '2025-11-01' AND '2025-12-31'
    comparison: scalar

