# Frozen expected facts for the 15 golden cases.
#
# Purpose: the answer-level rubric in evaluation/PROTOCOL.md section 4 scores
# the rendered answers of both the baseline and the gated system against the
# SAME hand-reviewed facts. These values were derived on 2026-10-06 by running
# each case's hand-written reference SQL (evaluation/golden_cases.yaml, sha256
# 32c8e14f81875d9dd3fe38aa555aba04b6c510b1a940a184c26e131b5938da92) through
# SQLExecutionPipeline against the live dataset and then checked value by
# value against a Decimal recomputation from the bundled CSVs. They were NOT
# produced by the production analysis model, gate or verifier.
#
# Fields per case:
#   answerable         false only for the deliberate empty-result case
#   direct_answer      the figure(s) a correct answer must state; each entry is
#                      {entity, metric, value, unit}; `value` is the exact
#                      reference value as text, compared under the precision
#                      rule in PROTOCOL.md section 4
#   minimum_coverage   what counts as answering the question at all
#   not_required       figures a correct answer may add but is not scored down
#                      for omitting
#   expected_outcome   only for the empty-result case
#
# Units: money = net amounts as stored, currency unconfirmed and not scored;
# percent = percentage points; fraction = 0..1 share; count = int.
#
# Geography labels follow the bundled CSVs (the "current Australian dataset").
# On 2026-10-06 the live BigQuery tables carried different branch and
# customer geography labels; this annex is valid only against a dataset whose
# column-level reconciliation with the CSVs passes.

